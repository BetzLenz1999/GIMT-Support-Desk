name: Timekeeping Cron

# Vercel Hobby accounts only allow daily cron jobs, so the every-5-minutes
# timekeeping job runs here instead. Set the repo secrets CRON_BASE_URL (for
# example https://your-project.vercel.app) and CRON_SECRET (same value as the
# Vercel env var) before enabling this workflow.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: timekeeping-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger timekeeping cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
        run: |
          if [ -z "$CRON_BASE_URL" ]; then
            echo "CRON_BASE_URL secret is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_BASE_URL%/}/api/cron/timekeeping"
